# Tag vX.Y.Z → build the roothide and rootless packages and attach both, plus
# their digests, to a GitHub Release.
#
# The release is what owngoal-packages scans. It looks for the newest release
# that is neither a draft nor a prerelease and whose tag carries no
# alpha/beta/rc/preview/dev/nightly marker, then picks the asset whose name ends
# in the architecture it wants and verifies it against SHA256SUMS.
#
# Shape: test ‖ compile → release. test and compile share nothing, so they run
# side by side; release needs both, so a failure in either fails the run
# without publishing. Add a port's own host tests to `test`, never to `compile`.

name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out fastfetch
        uses: actions/checkout@v4

      - name: Set version from tag
        if: github.ref_type == 'tag'
        run: make set-version VERSION="${GITHUB_REF_NAME}"

      - name: Validate scripts, config, and patch set
        run: make check

  compile:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Check out fastfetch
        uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          latest="$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' -print | sort -V | tail -n1)"
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install build and packaging tools
        run: |
          brew install cmake ninja ldid dpkg
          cmake --version | head -n1
          ninja --version
          ldid -h 2>&1 | head -n1 || true
          dpkg-deb --version | head -n1

      - name: Set version from tag
        if: github.ref_type == 'tag'
        run: make set-version VERSION="${GITHUB_REF_NAME}"

      - name: Prepare patched source
        run: make source

      - name: Build packages
        run: make debs

      - name: Summarize
        run: |
          cd build/Packages
          {
            echo "### fastfetch $(make -C "$GITHUB_WORKSPACE" --no-print-directory print-version)"
            echo
            echo "upstream: \`$(make -C "$GITHUB_WORKSPACE" --no-print-directory print-upstream)\`"
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
            echo
            dpkg-deb -I ./*iphoneos-arm64.deb | sed 's/^/    /'
          } >>"$GITHUB_STEP_SUMMARY"

      # Rendered here, where the version is set, so release needs no checkout.
      - name: Render release notes
        run: ./scripts/release-notes.sh "${GITHUB_REF_NAME}" >build/Packages/release-notes.md

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fastfetch-debs
          path: |
            build/Packages/*.deb
            build/Packages/SHA256SUMS
            build/Packages/release-notes.md
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [test, compile]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: fastfetch-debs
          path: dist

      - name: Create GitHub Release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha256sum -c SHA256SUMS
          gh release create "${GITHUB_REF_NAME}" \
            --title "fastfetch ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            ./*.deb SHA256SUMS \
          || { gh release edit "${GITHUB_REF_NAME}" --notes-file release-notes.md &&
               gh release upload "${GITHUB_REF_NAME}" \
                 ./*.deb SHA256SUMS --clobber; }
